# tmux configuration managed via dotfiles repository
# Start window and pane numbering at 1 (instead of the default 0)
set -g base-index 1
set -g pane-base-index 1

# ---- tmux Plugin Manager (TPM) ----
set -g @plugin 'tmux-plugins/tpm'           # TPM itself
set -g @plugin 'tmux-plugins/tmux-resurrect' # session restore plugin
set -g @resurrect-capture-pane-contents 'on'

# Initialise TPM (must be the last line in the file)
run '~/.tmux/plugins/tpm/tpm'
run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
