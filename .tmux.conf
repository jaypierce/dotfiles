# tmux configuration managed via dotfiles repository
# Unbind the default prefix (Ctrl+b)
unbind C-b

# Use backtick (`) as the tmux prefix key
set -g prefix `
bind ` send-prefix

# Enable mouse support for pane resizing and selection
set -g mouse on

# Vi-style copy mode bindings (copy to system clipboard via pbcopy on macOS; adjust for Windows if needed)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Start window and pane numbering at 1 (instead of the default 0)
set -g base-index 1
set -g pane-base-index 1
